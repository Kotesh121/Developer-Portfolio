services:

  mysql:
    image: mysql:8.0
    container_name: portfolio-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: portfolio_db

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./App_Server

    container_name: portfolio-backend
    restart: unless-stopped

    environment:
      MYSQL_URL: mysql+pymysql://root:password@mysql:3306/portfolio_db
      PORT: 8000
      ENVIRONMENT: production
      SESSION_SECRET: fa22e1c629706d5fecb7ccc545b560a4ad596042e563b86133bf19999aaaff29
      ADMIN_EMAIL: kotesh.yaggalam@gmail.com
      ADMIN_PASSWORD: Kotesh@123
      CORS_ORIGINS: http://localhost

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./Portfolio

    container_name: portfolio-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  mysql_data:
